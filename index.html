<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASHIER LMI-05</title>
    <link rel="icon" href="https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/hdwM43h8V6EeWHTA8Mxu/pub/0HnGoVRUn0BnbIqXvDVp.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --nav-height: 64px;
            --bg: #0f1117;
            --nav-bg: #1a1d27;
            --nav-border: #2a2d3a;
            --accent: #00c896;
            --accent-glow: rgba(0, 200, 150, 0.25);
            --text: #e0e0e6;
            --text-muted: #6b6f82;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .iframe-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding-bottom: var(--nav-height);
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            transition: opacity 0.25s ease;
        }

        iframe.loading {
            opacity: 0.4;
        }

        .loader-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0;
            background: linear-gradient(90deg, var(--accent), #00e6a8);
            z-index: 1000;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .loader-bar.active {
            width: 70%;
            transition: width 0.6s ease;
        }

        .loader-bar.done {
            width: 100%;
            transition: width 0.2s ease;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--nav-bg);
            border-top: 1px solid var(--nav-border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 999;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            height: 100%;
            cursor: pointer;
            position: relative;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: transform 0.15s ease;
        }

        .nav-item:active {
            transform: scale(0.92);
        }

        .nav-item .icon-wrap {
            width: 40px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: all 0.25s ease;
            position: relative;
        }

        .nav-item .icon-wrap i {
            font-size: 17px;
            color: var(--text-muted);
            transition: color 0.25s ease, transform 0.25s ease;
        }

        .nav-item .label {
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 0.2px;
            color: var(--text-muted);
            transition: color 0.25s ease;
            line-height: 1;
        }

        .nav-item.active .icon-wrap {
            background: var(--accent-glow);
        }

        .nav-item.active .icon-wrap i {
            color: var(--accent);
            transform: translateY(-1px);
        }

        .nav-item.active .label {
            color: var(--accent);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 3px;
            background: var(--accent);
            border-radius: 0 0 4px 4px;
            box-shadow: 0 0 10px var(--accent-glow);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { width: 0; opacity: 0; }
            to { width: 28px; opacity: 1; }
        }

        .nav-item .badge {
            position: absolute;
            top: 2px;
            right: calc(50% - 22px);
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            border: 2px solid var(--nav-bg);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
            50% { box-shadow: 0 0 0 4px transparent; }
        }

        .nav-item.active .badge {
            display: none;
        }

        .page-toast {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: var(--nav-bg);
            border: 1px solid var(--nav-border);
            color: var(--text);
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            z-index: 998;
            pointer-events: none;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .page-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .page-toast i {
            margin-right: 6px;
            color: var(--accent);
        }

        @media (min-width: 768px) {
            :root {
                --nav-height: 70px;
            }
            .nav-item .icon-wrap i {
                font-size: 19px;
            }
            .nav-item .label {
                font-size: 10.5px;
            }
        }

        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .bottom-nav {
                padding-bottom: env(safe-area-inset-bottom);
                height: calc(var(--nav-height) + env(safe-area-inset-bottom));
            }
            .iframe-container {
                padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <div class="loader-bar" id="loaderBar"></div>

    <div class="page-toast" id="pageToast">
        <i class="fa-solid fa-cash-register"></i>
        <span id="toastText">Cashier</span>
    </div>

    <div class="iframe-container">
        <iframe
            id="app"
            src="https://script.google.com/macros/s/AKfycbxzlieSZR11Gyyir_86h7o0YHmD1ahYYASoLRolTENdAp8TMn4plSzEfM8H4boqB8UX/exec"
            allow="fullscreen; camera; microphone; display-capture; geolocation">
        </iframe>
    </div>

    <nav class="bottom-nav" id="bottomNav">
        <div class="nav-item active" data-url="https://script.google.com/macros/s/AKfycbxzlieSZR11Gyyir_86h7o0YHmD1ahYYASoLRolTENdAp8TMn4plSzEfM8H4boqB8UX/exec" data-label="Cashier" data-icon="fa-solid fa-cash-register">
            <span class="badge"></span>
            <div class="icon-wrap">
                <i class="fa-solid fa-cash-register"></i>
            </div>
            <span class="label">Cashier</span>
        </div>

        <div class="nav-item" data-url="https://cashier05.github.io/Search-Produk/" data-label="Search Produk" data-icon="fa-solid fa-magnifying-glass">
            <div class="icon-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <span class="label">Search</span>
        </div>

        <div class="nav-item" data-url="https://cashier05.github.io/Price-Change-LMI/" data-label="Price Change" data-icon="fa-solid fa-tags">
            <div class="icon-wrap">
                <i class="fa-solid fa-tags"></i>
            </div>
            <span class="label">Price</span>
        </div>

        <div class="nav-item" data-url="https://cashier05.github.io/Tebus-Murah-KC/" data-label="Tebus Murah" data-icon="fa-solid fa-percent">
            <div class="icon-wrap">
                <i class="fa-solid fa-percent"></i>
            </div>
            <span class="label">Tebus Murah</span>
        </div>

        <div class="nav-item" data-url="https://cashier05.github.io/Schedule-LMI-05/" data-label="Schedule" data-icon="fa-solid fa-calendar-days">
            <div class="icon-wrap">
                <i class="fa-solid fa-calendar-days"></i>
            </div>
            <span class="label">Schedule</span>
        </div>
    </nav>

    <script>
        const iframe = document.getElementById('app');
        const loaderBar = document.getElementById('loaderBar');
        const pageToast = document.getElementById('pageToast');
        const toastText = document.getElementById('toastText');
        const navItems = document.querySelectorAll('.nav-item');
        let toastTimer = null;

        function showToast(label, iconClass) {
            clearTimeout(toastTimer);
            toastText.textContent = label;
            pageToast.querySelector('i').className = iconClass;
            pageToast.classList.add('show');
            toastTimer = setTimeout(() => {
                pageToast.classList.remove('show');
            }, 1800);
        }

        function startLoading() {
            loaderBar.className = 'loader-bar';
            void loaderBar.offsetWidth;
            loaderBar.classList.add('active');
        }

        function finishLoading() {
            loaderBar.classList.remove('active');
            loaderBar.classList.add('done');
            setTimeout(() => {
                loaderBar.className = 'loader-bar';
            }, 400);
        }

        navItems.forEach(item => {
            item.addEventListener('click', function() {
                const url = this.dataset.url;
                const label = this.dataset.label;
                const icon = this.dataset.icon;

                if (this.classList.contains('active')) return;

                navItems.forEach(n => n.classList.remove('active'));
                this.classList.add('active');

                showToast(label, icon);

                iframe.classList.add('loading');
                startLoading();

                iframe.onload = function() {
                    iframe.classList.remove('loading');
                    finishLoading();
                };

                iframe.src = url;

                setTimeout(() => {
                    iframe.classList.remove('loading');
                    finishLoading();
                }, 4000);
            });
        });

        window.addEventListener('popstate', function(e) {
            if (iframe.src !== navItems[0].dataset.url) {
                navItems.forEach(n => n.classList.remove('active'));
                navItems[0].classList.add('active');
                iframe.src = navItems[0].dataset.url;
                showToast('Cashier', 'fa-solid fa-cash-register');
            }
        });

        history.replaceState({ page: 'cashier' }, '', '');
    </script>
</body>
            </html>
